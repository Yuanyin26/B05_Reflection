name: Scaffold checks

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONDONTWRITEBYTECODE: "1"

jobs:
  checks:
    name: Python 3.11 / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Run Windows example
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./examples/run_local.ps1
      - name: Run Linux example and fixed entry
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash -n run.sh examples/run_local.sh
          bash examples/run_local.sh
          bash run.sh --task all --test --check-only --data-root data/examples --out-dir outputs/entry

  container:
    name: Linux container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Build image
        run: |
          docker compose --env-file .env.example config --quiet
          docker compose build research
      - name: Check container entry and read-only input
        shell: bash
        run: |
          # Prepare the bind source before any container, including --help.
          # Otherwise the daemon can create a root-owned directory on Linux.
          mkdir -p outputs/docker
          docker compose run --rm --user "$(id -u):$(id -g)" research --help
          docker compose run --rm --user "$(id -u):$(id -g)" research
